name: Build Brian Rotary CAM for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - Rotary-CAM-with-Visualizer

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-brian.txt

      - name: Build Windows application
        run: |
          python -m PyInstaller --clean --noconfirm Brian_Rotary_CAM.spec

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Brian-Rotary-CAM-Windows
          path: dist/Brian Rotary CAM/
          if-no-files-found: error
